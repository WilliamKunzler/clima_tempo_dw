<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Clima Tempo</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <a href="../index.html" class="marca">
                <i data-lucide="cloud" class="icone" aria-hidden="true"></i>
                <span class="texto-marca">ClimaTempo</span>
            </a>

            <form class="busca busca-pequena" role="search">
                <i data-lucide="search" class="icone-busca" aria-hidden="true"></i>
                <input type="search" placeholder="Pesquisar cidade" aria-label="Pesquisar cidade">
            </form>

            <nav class="menu">
                <a href="preview.html">Previsão</a>
                <a href="planos.html">Plano</a>
                <a href="login.html" class="botao-contorno ativo" aria-current="page">Entrar</a>
            </nav>
        </div>
    </header>

    <main class="container login">

        <section class="login-caixa">
            <h1>Entrar</h1>
            <p class="texto-auxiliar login-subtitulo">Acesse sua conta do ClimaTempo para acompanhar suas cidades.</p>

            <div class="login-erro" id="login-erro" role="alert" hidden>
                <strong id="login-erro-titulo">Não foi possível entrar</strong>
                <p id="login-erro-texto">E-mail ou senha incorretos. Verifique seus dados e tente novamente.</p>
            </div>

            <form class="login-form" id="login-form" novalidate>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="ana.silva@exemplo.com" autocomplete="email">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password">

                <button type="submit" class="botao-primario">Entrar</button>
            </form>

            <p class="texto-auxiliar login-rodape">Não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
        </section>

    </main>

    <footer class="rodape"></footer>

    <script src="../assets/js/lucide.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/login.js"></script>
</body>

</html>
